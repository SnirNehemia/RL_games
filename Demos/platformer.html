<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RL Agent Simulator V3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #d0ffd0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            background-color: #000;
            border: 3px double #333;
            margin-top: 5px;
            max-width: 100%;
        }
        .ui-container {
            width: 320px;
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 14px;
        }
        .reward-flash {
            font-weight: bold;
            transition: color 0.1s;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            width: 330px;
            justify-content: center;
            gap: 3px;
            margin-top: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 19%;
        }
        .action-btn {
            width: 100%;
            height: 50px;
            background-color: #1a1a1a;
            color: #d0ffd0;
            border: 2px solid #555;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            user-select: none;
        }
        .action-btn:active {
            background-color: #ff00ff;
            color: #000;
        }
        select {
            margin-top: 4px;
            background: #000;
            color: #5f5;
            border: 1px solid #333;
            width: 100%;
            font-size: 10px;
            font-family: 'Courier New', Courier, monospace;
        }
        #leaderboard {
            width: 320px;
            margin-top: 5px;
            font-size: 11px;
            border-top: 1px solid #222;
            padding-top: 3px;
            max-height: 70px;
            overflow-y: auto;
        }
        .instructions {
            width: 320px;
            font-size: 9px;
            color: #777;
            text-align: center;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="320" height="320"></canvas>

    <div class="ui-container">
        <div>$Score: <span id="scoreDisplay">0</span></div>
        <div>$Reward: <span id="rewardDisplay" class="reward-flash">0.00</span></div>
    </div>

    <div class="controls">
        <div class="control-group"><button class="action-btn" id="btn1">In 1</button><select id="map1"><option value="SigV">α</option><option value="SigW">β</option><option value="SigX" selected>γ</option><option value="SigY">δ</option><option value="SigZ">ε</option></select></div>
        <div class="control-group"><button class="action-btn" id="btn2">In 2</button><select id="map2"><option value="SigV">α</option><option value="SigW">β</option><option value="SigX">γ</option><option value="SigY" selected>δ</option><option value="SigZ">ε</option></select></div>
        <div class="control-group"><button class="action-btn" id="btn3">In 3</button><select id="map3"><option value="SigV">α</option><option value="SigW">β</option><option value="SigX">γ</option><option value="SigY">δ</option><option value="SigZ" selected>ε</option></select></div>
        <div class="control-group"><button class="action-btn" id="btn4">In 4</button><select id="map4"><option value="SigV" selected>α</option><option value="SigW">β</option><option value="SigX">γ</option><option value="SigY">δ</option><option value="SigZ">ε</option></select></div>
        <div class="control-group"><button class="action-btn" id="btn5"><In 5</button><select id="map5"><option value="SigV">α</option><option value="SigW" selected>β</option><option value="SigX">γ</option><option value="SigY">δ</option><option value="SigZ">ε</option></select></div>
    </div>

    <div class="instructions">
        RED (α)=Fast/Descend | GRN (β)=Dbl Jump | BLU (γ)=Efficiency
    </div>

    <div id="leaderboard">
        <strong>Previous Runs:</strong>
        <div id="lb-entries"></div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const rewardDisplay = document.getElementById('rewardDisplay');
    const lbEntries = document.getElementById('lb-entries');

    // MDP Parameters
    const GRAVITY = 0.35;
    const BASE_SPEED = 2.0;
    const RED_SPEED = 4.0;
    const JUMP_FORCE = -7.0;
    const DESCEND_VELOCITY = 8.0;

    // RL Penalties/Rewards
    const PENALTY_FALL = -100;
    const PENALTY_SPIKE = -75;
    const PENALTY_TRAP = -50;
    const REWARD_WIN = +500;
    const STEP_PENALTY_DEFAULT = -0.15;
    const STEP_PENALTY_BLUE = -0.03;

    // Mapping Logic
    const rawSignals = ['SigV', 'SigW', 'SigX', 'SigY', 'SigZ'];
    const possibleActions = ['Left', 'Right', 'Jump', 'ColorCycle', 'Special'];
    possibleActions.sort(() => Math.random() - 0.5);
    const secretModel = {};
    rawSignals.forEach((sig, i) => secretModel[sig] = possibleActions[i]);

    let activeInputs = { Left: false, Right: false, Jump: false, ColorCycle: false, Special: false };
    let prevInputs = { ...activeInputs };

    // Agent State
    let player = { x: 30, y: 260, vx: 0, vy: 0, w: 14, h: 14, isGrounded: false, colorMode: 1 };
    let colorList = ['#ff2222', '#22ff22', '#2266ff']; // R, G, B
    let canDoubleJump = false;
    let jumpRequested = false;
    let specialRequested = false;
    let isDropping = false; // Flag to skip platform collision

    // Environment Geometry (Static Puzzle Layout)
    const floorY = 300;
    const objects = {
        // Safe platforms (solid from top)
        platforms: [
            {x: 0, y: floorY, w: 320, h: 20, lethal: false}, // Ground
            {x: 10, y: 230, w: 70, h: 10, lethal: false}, // Start area higher
            {x: 100, y: 160, w: 70, h: 10, lethal: false}, // Higher platform (requires Double Jump)
            {x: 210, y: 110, w: 90, h: 10, lethal: false}, // Highest top platform
            {x: 190, y: 190, w: 110, h: 10, lethal: false, dropThrough: true}, // The specific platform required to descend
            {x: 230, y: 280, w: 80, h: 20, lethal: false}, // Safe pit floor
        ],
        // Lethal objects (Instant terminate)
        hazards: [
            { type: 'spike', x: 80, y: floorY, w: 150, h: 12 }, // Ground spikes
            { type: 'trap', x: 260, y: 210, r: 12 } // Purple circle above goal
        ],
        // The visible goal (Yellow Spikes = Good)
        goal: { x: 250, y: 280, w: 40, h: 12 }
    };

    let score = 0;
    let timeElapsed = 0;
    let episodeCount = 1;
    let history = [];
    let frameCount = 0;

    function resetEpisode(terminalReward, reason = "") {
        score += terminalReward;
        
        // Log episode performance
        history.unshift(`Run ${episodeCount} [${reason}]: ${score.toFixed(1)}`);
        if(history.length > 5) history.pop();
        lbEntries.innerHTML = history.join('<br>');

        // Visually flash reward
        rewardDisplay.innerText = terminalReward > 0 ? `+${terminalReward} ($WIN!)` : `${terminalReward} (${reason})`;
        rewardDisplay.style.color = terminalReward > 0 ? '#ff0' : '#f44';
        setTimeout(() => rewardDisplay.style.color = '#fff', 500);

        // Reset state
        player.x = 30;
        player.y = 200; // Reset above start plat
        player.vx = 0;
        player.vy = 0;
        player.colorMode = 1; // Start green for first jump
        score = 0;
        episodeCount++;
        timeElapsed = 0;
        isDropping = false;
    }

    // Input polling and edge detection
    function parseInputs() {
        for (let i = 1; i <= 5; i++) {
            const btn = document.getElementById(`btn${i}`);
            const sig = document.getElementById(`map${i}`).value;
            const action = secretModel[sig];
            // Reading from state variable handled by touch events
        }
        
        // Edge detection for toggles/instant actions
        if (activeInputs.ColorCycle && !prevInputs.ColorCycle) {
            player.colorMode = (player.colorMode + 1) % 3;
        }
        if (activeInputs.Jump && !prevInputs.Jump) {
            jumpRequested = true;
        }
        if (activeInputs.Special && !prevInputs.Special) {
            specialRequested = true;
        }
    }

    function updatePhysics() {
        parseInputs();
        frameCount++;

        // Apply context-aware logic
        let moveSpeed = (player.colorMode === 0) ? RED_SPEED : BASE_SPEED;
        let stepPenalty = (player.colorMode === 2) ? STEP_PENALTY_BLUE : STEP_PENALTY_DEFAULT;

        // X Movement
        if (activeInputs.Left) player.vx = -moveSpeed;
        else if (activeInputs.Right) player.vx = moveSpeed;
        else player.vx *= 0.8; // Inertia

        player.x += player.vx;
        // Basic screen walls
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        // Y Movement / Special Action
        player.vy += GRAVITY;

        // Descend mechanism (Red mode special on specific platform)
        if (player.colorMode === 0 && specialRequested && player.isGrounded) {
            // Check if standing on the drop-through platform
            for(let p of objects.platforms) {
                if(p.dropThrough && player.x + player.w > p.x && player.x < p.x + p.w && (player.y + player.h) === p.y) {
                    isDropping = true;
                    player.y += 5; // nudge below surface
                    player.vy = DESCEND_VELOCITY;
                    specialRequested = false; // consume input
                    break;
                }
            }
        }

        player.y += player.vy;
        specialRequested = false; // Reset if not used

        // Jump Logic
        if (jumpRequested) {
            if (player.isGrounded) {
                player.vy = JUMP_FORCE;
                player.isGrounded = false;
                if(player.colorMode === 1) canDoubleJump = true; // Green enables dbl
            } else if (player.colorMode === 1 && canDoubleJump) {
                player.vy = JUMP_FORCE * 0.9;
                canDoubleJump = false;
            }
            jumpRequested = false; // consume input
        }

        // --- Collision Handling ---
        
        // Goal Collision (Winning Condition)
        if (player.x < objects.goal.x + objects.goal.w && player.x + player.w > objects.goal.x &&
            player.y + player.h > objects.goal.y && player.y < objects.goal.y + objects.goal.h) {
            resetEpisode(REWARD_WIN, "SUCCESS");
            return;
        }

        // Hazards Collision
        for (let h of objects.hazards) {
            if (h.type === 'spike') {
                if (player.x < h.x + h.w && player.x + player.w > h.x &&
                    player.y + player.h > h.y && player.y < h.y + h.h) {
                    resetEpisode(PENALTY_SPIKE, "SPIKE");
                    return;
                }
            } else if (h.type === 'trap') {
                let dx = (player.x + player.w/2) - h.x;
                let dy = (player.y + player.h/2) - h.y;
                if (Math.sqrt(dx*dx + dy*dy) < h.r + player.w/2) {
                    resetEpisode(PENALTY_TRAP, "TRAP");
                    return;
                }
            }
        }

        // Platform Solidification
        player.isGrounded = false;
        
        // Prevent collision checks if explicitly dropping through
        if (!isDropping) {
            for (let p of objects.platforms) {
                // One-way platform logic (collide only when falling and above)
                if (player.vx >= 0 && 
                    player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y + player.h > p.y && player.y + player.h < p.y + p.h + (player.vy + 2)) {
                    
                    if (player.vy >= 0) { // Falling down onto
                        player.isGrounded = true;
                        player.vy = 0;
                        player.y = p.y - player.h;
                        canDoubleJump = false; 
                    }
                }
            }
        }
        
        // Reset drop flag once clear of the 'descend' platform
        if (isDropping && player.vy > 0) {
            let onDropPlat = false;
            for(let p of objects.platforms) {
                if(p.dropThrough && player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h) {
                    onDropPlat = true;
                }
            }
            if (!onDropPlat) isDropping = false;
        }

        // Fall through bottom
        if (player.y > canvas.height + 20) {
            resetEpisode(PENALTY_FALL, "VOID");
            return;
        }

        // RL Reward Signal processing
        score += stepPenalty; 
        
        // UI Updates
        scoreDisplay.innerText = score.toFixed(1);
        rewardDisplay.innerText = stepPenalty.toFixed(2);
        rewardDisplay.style.color = (player.colorMode === 2) ? '#88f' : '#888'; // Visual hint for blue efficiency

        // Prepare input state for next frame
        prevInputs = { ...activeInputs };
    }

    // Bizarre Render Engine
    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Scanlines effect
        if(frameCount % 2 === 0) {
            ctx.fillStyle = 'rgba(20, 20, 20, 0.3)';
            for(let i=0; i<canvas.height; i+=2) ctx.fillRect(0, i, canvas.width, 1);
        }

        // Platforms
        for (let p of objects.platforms) {
            ctx.fillStyle = p.dropThrough ? '#331111' : '#222';
            ctx.strokeStyle = p.dropThrough ? '#733' : '#444';
            ctx.lineWidth = 1;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeRect(p.x, p.y, p.w, p.h);
            
            if(p.dropThrough) {
                ctx.fillStyle = '#622';
                ctx.font = '8px sans-serif';
                ctx.fillText('v RED v', p.x + 35, p.y+8);
            }
        }

        // Ground Spikes
        ctx.fillStyle = '#600';
        for (let h of objects.hazards) {
            if (h.type === 'spike') {
                for (let i = 0; i < h.w; i += 10) {
                    ctx.beginPath();
                    ctx.moveTo(h.x + i, h.y + h.h);
                    ctx.lineTo(h.x + i + 5, h.y);
                    ctx.lineTo(h.x + i + 10, h.y + h.h);
                    ctx.fill();
                }
            } else if (h.type === 'trap') {
                ctx.strokeStyle = `hsl(${(frameCount*5)%360}, 100%, 50%)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.r + Math.sin(frameCount*0.1)*2, 0, Math.PI*2);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 0, 255, 0.1)';
                ctx.fill();
            }
        }

        // The Goal (Looks like deadly spikes, but yellow)
        ctx.fillStyle = '#ff0'; // Yellow = GOOD (Bizarre priority)
        let g = objects.goal;
        for (let i = 0; i < g.w; i += 8) {
            ctx.beginPath();
            ctx.moveTo(g.x + i, g.y + g.h);
            ctx.lineTo(g.x + i + 4, g.y);
            ctx.lineTo(g.x + i + 8, g.y + g.h);
            ctx.fill();
        }

        // Agent
        ctx.fillStyle = colorList[player.colorMode];
        ctx.fillRect(player.x, player.y, player.w, player.h);
        
        // Glitch effect on agent
        if(Math.random() < 0.05) {
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x - 2, player.y + 4, player.w + 4, 2);
        }

        // "Bizarre" Eyes
        ctx.fillStyle = '#000';
        let eyeOffset = Math.sin(frameCount * 0.1) * 2;
        ctx.fillRect(player.x + 2, player.y + 3 + eyeOffset, 3, 3);
        ctx.fillRect(player.x + 9, player.y + 3 - eyeOffset, 3, 3);
    }

    function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    // Touch Event Handling for Mobile Actions
    function setInput(id, active) {
        const sig = document.getElementById(`map${id}`).value;
        const action = secretModel[sig];
        activeInputs[action] = active;
    }

    ['1','2','3','4','5'].forEach(id => {
        const btn = document.getElementById(`btn${id}`);
        // Mobile
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); setInput(id, true); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); setInput(id, false); });
        // Desktop support
        btn.addEventListener('mousedown', () => setInput(id, true));
        btn.addEventListener('mouseup', () => setInput(id, false));
        btn.addEventListener('mouseleave', () => setInput(id, false));
    });

    // Start
    resetEpisode(0, "INIT");
    loop();
</script>
</body>
</html>
