<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RL Agent Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            background-color: #000;
            border: 2px solid #333;
            margin-top: 10px;
            max-width: 100%;
        }
        .ui-container {
            width: 320px;
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 14px;
        }
        .reward-flash {
            font-weight: bold;
            transition: color 0.2s;
        }
        .controls {
            display: flex;
            width: 320px;
            justify-content: space-between;
            margin-top: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
        }
        .action-btn {
            width: 100%;
            height: 60px;
            background-color: #222;
            color: #0f0;
            border: 1px solid #0f0;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            touch-action: none; /* Prevents mobile scrolling */
            cursor: pointer;
            user-select: none;
        }
        .action-btn:active {
            background-color: #0f0;
            color: #000;
        }
        select {
            margin-top: 5px;
            background: #111;
            color: #0f0;
            border: 1px solid #333;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
        }
        #leaderboard {
            width: 320px;
            margin-top: 10px;
            font-size: 12px;
            border-top: 1px dashed #333;
            padding-top: 5px;
            max-height: 80px;
            overflow-y: auto;
        }
        .instructions {
            width: 320px;
            font-size: 10px;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="320" height="300"></canvas>

    <div class="ui-container">
        <div>Score: <span id="scoreDisplay">0</span></div>
        <div>Reward: <span id="rewardDisplay" class="reward-flash">0.00</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <button class="action-btn" id="btn1">BTN 1</button>
            <select id="map1">
                <option value="SigX">Signal X</option>
                <option value="SigY">Signal Y</option>
                <option value="SigZ">Signal Z</option>
            </select>
        </div>
        <div class="control-group">
            <button class="action-btn" id="btn2">BTN 2</button>
            <select id="map2">
                <option value="SigX">Signal X</option>
                <option value="SigY" selected>Signal Y</option>
                <option value="SigZ">Signal Z</option>
            </select>
        </div>
        <div class="control-group">
            <button class="action-btn" id="btn3">BTN 3</button>
            <select id="map3">
                <option value="SigX">Signal X</option>
                <option value="SigY">Signal Y</option>
                <option value="SigZ" selected>Signal Z</option>
            </select>
        </div>
    </div>

    <div class="instructions">
        Goal is hidden (POMDP). Learn from the reward.<br>
        Map buttons to signals to find comfortable controls.
    </div>

    <div id="leaderboard">
        <strong>Past Episodes:</strong>
        <div id="lb-entries"></div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const rewardDisplay = document.getElementById('rewardDisplay');
    const lbEntries = document.getElementById('lb-entries');

    // MDP/Environment Settings
    const GRAVITY = 0.4;
    const SPEED = 2.5;
    const JUMP_FORCE = -7.5;
    const STEP_PENALTY = -0.1;

    // Secret Mapping: Randomly assign Signals to actual Actions
    const actions = ['Left', 'Right', 'Jump'];
    actions.sort(() => Math.random() - 0.5);
    const secretMap = {
        'SigX': actions[0],
        'SigY': actions[1],
        'SigZ': actions[2]
    };

    let activeActions = { Left: false, Right: false, Jump: false };

    // Game State
    let player = { x: 150, y: 250, vx: 0, vy: 0, w: 16, h: 16, isGrounded: false };
    let goal = { x: 0, y: 0, r: 25 }; // Location randomized per episode
    let platforms = [
        { x: 0, y: 280, w: 320, h: 20 },
        { x: 40, y: 220, w: 60, h: 10 },
        { x: 220, y: 180, w: 60, h: 10 },
        { x: 120, y: 130, w: 80, h: 10 },
        { x: 30, y: 70, w: 60, h: 10 },
        { x: 240, y: 50, w: 50, h: 10 }
    ];

    let score = 0;
    let minDistanceToGoal = 9999;
    let episodeCount = 1;
    let history = [];

    function randomizeGoal() {
        // Place goal somewhere high up
        goal.x = 40 + Math.random() * 240;
        goal.y = 30 + Math.random() * 100;
    }

    function resetEpisode(terminalReward) {
        score += terminalReward;
        
        // Save to leaderboard
        history.unshift(`Ep ${episodeCount}: ${score.toFixed(1)}`);
        if(history.length > 5) history.pop();
        lbEntries.innerHTML = history.join('<br>');

        // Flash UI
        rewardDisplay.innerText = terminalReward > 0 ? `+${terminalReward} (FOUND IT!)` : `${terminalReward} (DIED)`;
        rewardDisplay.style.color = terminalReward > 0 ? '#0f0' : '#f00';
        setTimeout(() => rewardDisplay.style.color = '#0f0', 1000);

        // Reset state
        player.x = 150;
        player.y = 250;
        player.vx = 0;
        player.vy = 0;
        score = 0;
        episodeCount++;
        randomizeGoal();
        
        // Reset distance tracker to force exploration
        minDistanceToGoal = getDistanceToGoal(); 
    }

    function getDistanceToGoal() {
        const px = player.x + player.w/2;
        const py = player.y + player.h/2;
        return Math.sqrt(Math.pow(px - goal.x, 2) + Math.pow(py - goal.y, 2));
    }

    function updatePhysics() {
        // Apply inputs
        if (activeActions.Left) player.vx = -SPEED;
        else if (activeActions.Right) player.vx = SPEED;
        else player.vx = 0;

        if (activeActions.Jump && player.isGrounded) {
            player.vy = JUMP_FORCE;
            player.isGrounded = false;
        }

        // Gravity
        player.vy += GRAVITY;

        // Move X
        player.x += player.vx;
        // Screen bounds X
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        // Move Y
        player.y += player.vy;
        player.isGrounded = false;

        // Platform Collisions
        for (let p of platforms) {
            if (player.x < p.x + p.w && player.x + player.w > p.x &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + 10 &&
                player.vy >= 0) {
                player.isGrounded = true;
                player.vy = 0;
                player.y = p.y - player.h;
            }
        }

        // Death condition
        if (player.y > canvas.height) {
            resetEpisode(-50);
            return;
        }

        // Reward logic (RL Core)
        let instantReward = STEP_PENALTY; // Time penalty encourages speed
        let dist = getDistanceToGoal();

        // Dense reward for getting closer to the unseen goal (Shaping)
        if (dist < minDistanceToGoal) {
            instantReward += (minDistanceToGoal - dist) * 0.5;
            minDistanceToGoal = dist;
        }

        // Sparse reward for finding the goal
        if (dist < goal.r) {
            resetEpisode(100);
            return;
        }

        score += instantReward;
        
        // Update UI
        scoreDisplay.innerText = score.toFixed(1);
        if (Math.abs(instantReward) > 0.15) {
            rewardDisplay.innerText = instantReward > 0 ? `+${instantReward.toFixed(2)}` : instantReward.toFixed(2);
            rewardDisplay.style.color = instantReward > 0 ? '#0f0' : (instantReward < -0.15 ? '#f00' : '#888');
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw platforms
        ctx.fillStyle = '#444';
        for (let p of platforms) {
            ctx.fillRect(p.x, p.y, p.w, p.h);
        }

        // The Goal is INVISIBLE! (POMDP)
        // Uncomment to debug:
        // ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,0,0.2)'; ctx.fill();

        // Draw Player (Agent)
        ctx.fillStyle = '#0f0';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        
        // Draw Eyes to make it look bizarre
        ctx.fillStyle = '#000';
        ctx.fillRect(player.x + 3, player.y + 3, 3, 3);
        ctx.fillRect(player.x + 10, player.y + 3, 3, 3);
    }

    function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    // Input Handling
    function handleInput(btnId, isDown) {
        // Read which signal the user has mapped to this button
        const mapSelectId = btnId.replace('btn', 'map');
        const selectedSignal = document.getElementById(mapSelectId).value;
        
        // Look up the secret true action for this signal
        const trueAction = secretMap[selectedSignal];
        activeActions[trueAction] = isDown;
    }

    // Mobile touch events
    ['btn1', 'btn2', 'btn3'].forEach(id => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(id, true); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); handleInput(id, false); });
        
        // Mouse fallbacks for desktop testing
        btn.addEventListener('mousedown', () => handleInput(id, true));
        btn.addEventListener('mouseup', () => handleInput(id, false));
        btn.addEventListener('mouseleave', () => handleInput(id, false));
    });

    randomizeGoal();
    loop();
</script>
</body>
</html>
